  <path fill="url(#body)" d="M18 178
    C56 168 78 136 118 126
    C146 119 162 120 170 100
    C175 80 186 66 206 66
    C226 66 238 78 238 93
    C238 106 229 112 215 112
    L198 112
    C190 114 188 126 188 140
    C188 168 177 188 158 194
    C138 200 110 200 94 192
    C70 185 44 182 18 178 Z"/>

  <!-- Eye and smile -->
  <circle cx="212" cy="86" r="7" fill="#FFF7ED"/>
