    <path d="M124 136 C112 116 118 96 134 82 C134 98 142 104 146 110 C150 100 156 94 164 90 C168 108 160 124 150 136 Z"/>
  </g>
  <g fill="url(#core)">
    <path d="M66 162 C62 150 66 140 72 134 C74 142 80 146 82 152 C84 156 82 160 78 162 Z"/>
    <path d="M98 146 C92 130 96 116 106 106 C108 118 116 124 120 132 C122 138 118 144 114 146 Z"/>
    <path d="M132 132 C128 120 132 110 138 104 C140 112 146 116 150 122 C152 128 148 132 144 132 Z"/>
  </g>

  <!-- Legs, tucked under the body -->
  <rect x="100" y="170" width="24" height="54" rx="11" fill="#D9480F"/>
  <rect x="148" y="170" width="24" height="54" rx="11" fill="#D9480F"/>

