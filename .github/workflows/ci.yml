name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type-check against web platform libs
        run: npm run check

      - name: Run tests in workerd
        run: npm test

      - name: Check the examples in workerd
        run: npm run examples

      - name: Publish dry run
        run: npx -y jsr@0.14.3 publish --dry-run

  # Publishes when deno.json has a version that is not on JSR yet. Otherwise
  # the publish skips it. Authenticates with OIDC through the repository
  # linked in the JSR package settings.
  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Publish to JSR
        run: npx -y jsr@0.14.3 publish
